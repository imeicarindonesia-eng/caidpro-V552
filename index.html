                    if (startObj !== -1 && (startArr === -1 || startObj < startArr)) {

                    } else if (startArr !== -1) {

                        setSearchResult(JSON.parse(cached));
                        setCurrentPage('result');
                        setLoading(false);
                        return;
                    }
                } catch (e) {
                    console.warn("sessionStorage error:", e);
                }

                const requestPool = [];
                const baseUrls = [
                    `${API_UTAMA_1}${encodeURIComponent(cleanQuery)}`,
                    `${API_UTAMA_2}${encodeURIComponent(cleanQuery)}`
                ];

                baseUrls.forEach(baseUrl => {
                    requestPool.push({ url: baseUrl, type: 'Direct APK Connection' });
                    requestPool.push({ url: `https://api.allorigins.win/raw?url=${encodeURIComponent(baseUrl)}`, type: 'AllOrigins Raw' });
                    requestPool.push({ url: `https://corsproxy.io/?${encodeURIComponent(baseUrl)}`, type: 'CORSProxy.io' });
                    requestPool.push({ url: `https://allorigins.hexschool.workers.dev/raw?url=${encodeURIComponent(baseUrl)}`, type: 'Hexschool Cloudflare' });
                    requestPool.push({ url: `https://api.allorigins.win/get?url=${encodeURIComponent(baseUrl)}`, type: 'AllOrigins Wrapped' });
                    requestPool.push({ url: `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(baseUrl)}`, type: 'CodeTabs' });
                });

                let resolved = false;
                let activeRequests = requestPool.length;
                const controllers = [];

                const cleanLoadingAndTransition = (data) => {
                    if (resolved) return;
                    resolved = true;
                    
                    controllers.forEach(ctrl => {
                        try { ctrl.abort(); } catch(e) {}
                    });

                    try {
                        sessionStorage.setItem(cleanQuery, JSON.stringify(data));
                    } catch (e) {}

                    setSearchResult(data);
                    setCurrentPage('result');
                    setLoading(false);
                };

                const handleFailure = () => {
                    activeRequests--;
                    if (activeRequests === 0 && !resolved) {
                        setLoading(false);
                        showMsg("DATA TIDAK DITEMUKAN / TIMEOUT");
                    }
                };

                requestPool.forEach((targetObj) => {
                    const ctrl = new AbortController();
                    controllers.push(ctrl);
                    const id = setTimeout(() => ctrl.abort(), 8000); 

                    try {
                        fetch(targetObj.url, { signal: ctrl.signal })
                            .then(async (res) => {
                                clearTimeout(id);
                                if (resolved) return;
                                if (!res.ok) { handleFailure(); return; }
                                
                                const text = await res.text();
                                const vehicleData = unifyAndExtractVehicleData(text);
                                
                                if (vehicleData && !resolved) {
                                    cleanLoadingAndTransition(vehicleData);
                                } else {
                                    handleFailure();
                                }
                            })
                            .catch((err) => {
                                clearTimeout(id);
                                handleFailure();
                            });
                    } catch (err) {
                        clearTimeout(id);
                        handleFailure();
                    }
                });
            };

            const extractField = (item, keys) => {
                if (!item) return '-';
                for (let k of keys) {
                    if (item[k] !== undefined && item[k] !== null && item[k] !== '') {

                return '-';

                    case 'HP':

                    case 'Pekerjaan':

                    case 'Alamat':

                    case 'NopolServer': {

                        const n = extractField(item, ['nopol', 'Nopol', 'no_polisi', 'noPolisi', 'Nopol1']).replace(/\s+/g, '').toUpperCase();

                                    <input 
                                        type="text"
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        placeholder="Cari ID / PIN..."
                                        className="w-full p-3 bg-black/60 border border-zinc-800 rounded-xl text-white font-mono text-xs focus:outline-none focus:border-orange-500"
                                    />

                                    <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                                        {managedPins
                                            .filter(item => item.id.includes(searchTerm.trim()))
                                            .map((item) => {
                                                const isExpired = item.expiry !== 'UNLIMITED' && Date.now() > item.expiry;
                                                return (
                                                    <div key={item.id} className="bg-black/60 p-3 rounded-xl border border-zinc-800 flex items-center justify-between font-mono text-xs">
                                                        <div>
                                                            <div className="flex items-center space-x-2">
                                                                <strong className="text-orange-400">{item.id}</strong>
                                                                <span className={`text-[9px] px-1.5 py-0.5 rounded uppercase font-bold ${item.isBlocked ? 'bg-red-950 text-red-400' : isExpired ? 'bg-yellow-950 text-yellow-400' : 'bg-green-950 text-green-400'}`}>
                                                                    {item.isBlocked ? 'BLOKIR' : isExpired ? 'EXPIRED' : 'AKTIF'}
                                                                </span>
                                                            </div>
                                                            <span className="text-[10px] text-zinc-500 block mt-1">
                                                                Role: {item.role || 'user'} | Exp: {item.expiry === 'UNLIMITED' ? 'Permanen' : new Date(item.expiry).toLocaleDateString()}
                                                            </span>
                                                        </div>
                                                        <div className="flex items-center space-x-1.5">
                                                            <button onClick={() => setDurationModal(item)} className="p-2 bg-zinc-800 hover:bg-zinc-700 text-orange-400 rounded-lg text-[10px] font-bold uppercase">
                                                                DURASI
                                                            </button>
                                                            <button onClick={async () => {
                                                                const newStatus = !item.isBlocked;
                                                                await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('csid_pro_pins').doc(item.id).set({ isBlocked: newStatus }, { merge: true });
                                                            }} className={`p-2 rounded-lg text-[10px] font-bold uppercase transition ${item.isBlocked ? 'bg-green-600 text-white' : 'bg-red-600 text-white'}`}>
                                                                {item.isBlocked ? 'BUKA' : 'BLOK'}
                                                            </button>
                                                            <button onClick={() => setConfirmModal({
                                                                title: 'HAPUS PIN',
                                                                message: `Hapus PIN ${item.id} dari sistem?`,
                                                                onConfirm: async () => {
                                                                    await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('csid_pro_pins').doc(item.id).delete();
                                                                    setConfirmModal(null);
                                                                    showMsg("PIN DIHAPUS");
                                                                }
                                                            })} className="p-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg text-[10px]">
                                                                <Icons.X />
                                                            </button>
                                                        </div>
                                                    </div>
                                                );
                                        })}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {showPinModal && (
                        <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-6">
                            <div className="glass-panel p-6 rounded-3xl w-full max-w-sm space-y-4 border border-zinc-800">
                                <div className="flex items-center justify-between">
                                    <h3 className="text-sm font-black text-white uppercase tracking-wider">LOGIN MASTER ADMIN</h3>
                                    <button onClick={() => setShowPinModal(false)} className="text-zinc-500 hover:text-white"><Icons.X /></button>
                                </div>
                                <input 
                                    type="password" 
                                    value={pinInput}
                                    onChange={(e) => setPinInput(e.target.value)}
                                    placeholder="MASUKKAN PIN MASTER"
                                    className="w-full p-4 bg-black border border-zinc-800 rounded-xl text-white font-mono text-center tracking-widest text-lg focus:outline-none focus:border-orange-500"
                                />
                                <button onClick={handleMasterLogin} className="w-full py-4 bg-orange-600 hover:bg-orange-500 transition rounded-xl font-bold uppercase text-white tracking-widest text-xs">
                                    AUTENTIKASI
                                </button>
                            </div>
                        </div>
                    )}

                    {showAddPinModal && (
                        <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-6">
                            <div className="glass-panel p-6 rounded-3xl w-full max-w-sm space-y-4 border border-zinc-800 font-mono">
                                <div className="flex items-center justify-between">
                                    <h3 className="text-sm font-black text-white uppercase tracking-wider">TAMBAH PIN / USER</h3>
                                    <button onClick={() => setShowAddPinModal(false)} className="text-zinc-500 hover:text-white"><Icons.X /></button>
                                </div>
                                <div>
                                    <label className="text-[10px] text-zinc-500 block mb-1 uppercase">ID PIN / REGISTRASI (6 DIGIT)</label>
                                    <input 
                                        type="text" 
                                        value={newPinInput}
                                        onChange={(e) => setNewPinInput(e.target.value)}
                                        placeholder="CONTOH: 123456"
                                        className="w-full p-3 bg-black border border-zinc-800 rounded-xl text-white text-center tracking-widest font-bold focus:outline-none focus:border-orange-500 text-sm"
                                    />
                                </div>
                                <div>
                                    <label className="text-[10px] text-zinc-500 block mb-1 uppercase">DURASI AKTIF</label>
                                    <select 
                                        value={newPinDuration}
                                        onChange={(e) => setNewPinDuration(e.target.value === 'UNLIMITED' ? 'UNLIMITED' : Number(e.target.value))}
                                        className="w-full p-3 bg-black border border-zinc-800 rounded-xl text-white text-xs focus:outline-none focus:border-orange-500"
                                    >
                                        {durationOptions.map((opt, i) => (
                                            <option key={i} value={opt.v}>{opt.l}</option>
                                        ))}
                                    </select>
                                </div>
                                <button onClick={async () => {
                                    if (!newPinInput.trim()) { showMsg("MASUKKAN ID PIN"); return; }
                                    const expiryTime = newPinDuration === 'UNLIMITED' ? 'UNLIMITED' : Date.now() + Number(newPinDuration);
                                    try {
                                        await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('csid_pro_pins').doc(newPinInput.trim()).set({
                                            role: 'user',
                                            expiry: expiryTime,
                                            isBlocked: false,
                                            deviceId: null,
                                            createdAt: Date.now()
                                        });
                                        showMsg("PIN BERHASIL DITAMBAHKAN");
                                        setShowAddPinModal(false);
                                        setNewPinInput('');
                                    } catch(e) { showMsg("GAGAL MENAMBAHKAN PIN"); }
                                }} className="w-full py-4 bg-orange-600 hover:bg-orange-500 transition rounded-xl font-bold uppercase text-white tracking-widest text-xs">
                                    SIMPAN & AKTIFKAN
                                </button>
                            </div>
                        </div>
                    )}

                    {durationModal && (
                        <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-6">
                            <div className="glass-panel p-6 rounded-3xl w-full max-w-sm space-y-4 border border-zinc-800 font-mono">
                                <div className="flex items-center justify-between">
                                    <h3 className="text-sm font-black text-white uppercase tracking-wider">PERPANJANG PIN: {durationModal.id}</h3>
                                    <button onClick={() => setDurationModal(null)} className="text-zinc-500 hover:text-white"><Icons.X /></button>
                                </div>
                                <div>
                                    <label className="text-[10px] text-zinc-500 block mb-1 uppercase">PILIH TAMBAHAN DURASI</label>
                                    <select 
                                        id="extendDurationSelect"
                                        className="w-full p-3 bg-black border border-zinc-800 rounded-xl text-white text-xs focus:outline-none focus:border-orange-500"
                                    >
                                        {durationOptions.map((opt, i) => (
                                            <option key={i} value={opt.v}>{opt.l}</option>
                                        ))}
                                    </select>
                                </div>
                                <button onClick={async () => {
                                    const selectEl = document.getElementById('extendDurationSelect');
                                    const val = selectEl.value;
                                    const newExp = val === 'UNLIMITED' ? 'UNLIMITED' : Date.now() + Number(val);
                                    try {
                                        await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('csid_pro_pins').doc(durationModal.id).set({
                                            expiry: newExp,
                                            isBlocked: false
                                        }, { merge: true });
                                        showMsg("DURASI DIPERBARUI");
                                        setDurationModal(null);
                                    } catch (e) { showMsg("GAGAL PERPANJANG"); }
                                }} className="w-full py-4 bg-orange-600 hover:bg-orange-500 transition rounded-xl font-bold uppercase text-white tracking-widest text-xs">
                                    TERAPKAN DURASI
                                </button>
                            </div>
                        </div>
                    )}

                    {confirmModal && (
                        <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-6">
                            <div className="glass-panel p-6 rounded-3xl w-full max-w-sm space-y-4 border border-zinc-800 font-mono text-center">
                                <h3 className="text-sm font-black text-white uppercase tracking-wider">{confirmModal.title}</h3>
                                <p className="text-xs text-zinc-400">{confirmModal.message}</p>
                                <div className="flex space-x-2 pt-2">
                                    <button onClick={() => setConfirmModal(null)} className="flex-1 py-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-xl font-bold uppercase text-xs">
                                        BATAL
                                    </button>
                                    <button onClick={confirmModal.onConfirm} className="flex-1 py-3 bg-red-600 hover:bg-red-500 text-white rounded-xl font-bold uppercase text-xs">
                                        YA, LANJUTKAN
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
