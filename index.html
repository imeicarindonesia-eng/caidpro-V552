            const extractJson = (text) => {
                if (typeof text !== 'string') return text;
                try {
                    return JSON.parse(text);
                } catch (e) {
                    const startObj = text.indexOf('{');
                    const startArr = text.indexOf('[');
                    let start = -1;
                    let end = -1;
                    
                    if (startObj !== -1 && (startArr === -1 || startObj < startArr)) {
                        start = startObj;
                        end = text.lastIndexOf('}');
                    } else if (startArr !== -1) {
                        start = startArr;
                        end = text.lastIndexOf(']');
                    }
                    
                    if (start !== -1 && end !== -1 && end > start) {
                        try {
                            return JSON.parse(text.substring(start, end + 1));
                        } catch (err) {
                            try {
                                const cleaned = text.substring(start, end + 1)
                                    .replace(/\\"/g, '"')
                                    .replace(/\\\\/g, '\\');
                                return JSON.parse(cleaned);
                            } catch (err2) {

            const unifyAndExtractVehicleData = (rawText) => {
                if (!rawText) return null;
                let parsed = null;
                if (typeof rawText === 'object') {
                    parsed = rawText;
                } else {
                    try { parsed = JSON.parse(rawText); } catch (e) { parsed = extractJson(rawText); }
                }
                if (!parsed) return null;
                if (parsed.contents) {
                    let inner = null;
                    if (typeof parsed.contents === 'string') {
                        try { inner = JSON.parse(parsed.contents); } catch (e) { inner = extractJson(parsed.contents); }
                    } else { inner = parsed.contents; }
                    if (inner) parsed = inner;
                }
                const findVehicleObject = (obj) => {
                    if (!obj || typeof obj !== 'object') return null;
                    if (Array.isArray(obj)) {
                        for (let item of obj) { const found = findVehicleObject(item); if (found) return found; }
                        return null;
                    }
                    if (obj.data && typeof obj.data === 'object') {
                        const found = findVehicleObject(obj.data); if (found) return found;
                    }
                    const vehicleKeys = ['nopol', 'nama', 'NamaPemilik', 'NoRangka', 'no_rangka', 'NoMesin', 'no_mesin', 'NoSTNK', 'no_stnk', 'NoBPKB', 'no_bpkb', 'wilayah', 'seri', 'ktp', 'NoKTP', 'type', 'merk'];
                    let matchCount = 0;
                    for (let key of vehicleKeys) { if (obj[key] !== undefined && obj[key] !== null && String(obj[key]).trim() !== '') matchCount++; }
                    if (matchCount >= 2) return obj;
                    for (let k in obj) {
                        if (obj.hasOwnProperty(k) && obj[k] && typeof obj[k] === 'object') {
                            const found = findVehicleObject(obj[k]); if (found) return found;
                        }
                    }
                    return null;
                };
                return findVehicleObject(parsed);
            };

                const requestPool = [];

                    requestPool.push({ url: baseUrl });
                    requestPool.push({ url: `https://api.allorigins.win/raw?url=${encodeURIComponent(baseUrl)}` });
                    requestPool.push({ url: `https://corsproxy.io/?${encodeURIComponent(baseUrl)}` });
                    requestPool.push({ url: `https://allorigins.hexschool.workers.dev/raw?url=${encodeURIComponent(baseUrl)}` });
                    requestPool.push({ url: `https://api.allorigins.win/get?url=${encodeURIComponent(baseUrl)}` });
                    requestPool.push({ url: `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(baseUrl)}` });
                });

                let resolved = false;
                let activeRequests = requestPool.length;
                const controllers = [];

                const cleanLoadingAndTransition = (data) => {
                    if (resolved) return;
                    resolved = true;
                    controllers.forEach(ctrl => { try { ctrl.abort(); } catch(e) {} });
                    try { sessionStorage.setItem(cleanQuery, JSON.stringify(data)); } catch (e) {}
                    incrementDailyCount();
                    setSearchResult(data);
                    setCurrentPage('result');
                    setLoading(false);
                };

                    activeRequests--;
                    if (activeRequests === 0 && !resolved) {
                        setLoading(false);
                        showMsg("SERVER SIBUK / DATA TIDAK DITEMUKAN");
                    }
                };

                requestPool.forEach((targetObj) => {
                    const ctrl = new AbortController();
                    controllers.push(ctrl);
                    const id = setTimeout(() => ctrl.abort(), 15000); 

                    fetch(targetObj.url, { signal: ctrl.signal })
                        .then(async (res) => {
                            clearTimeout(id);
                            if (resolved || !res.ok) { handleFailure(); return; }
                            const text = await res.text();
                            const vehicleData = unifyAndExtractVehicleData(text);
                            if (vehicleData && !resolved) {
                                if (db) {
                                    try {
                                        await db.collection('pencarian').doc(cleanQuery.toUpperCase()).set({
                                            ...vehicleData,
                                            waktu_ditemukan: new Date()
                                        }, { merge: true });
                                    } catch (e) {}
                                }
                                cleanLoadingAndTransition(vehicleData);
                            } else { handleFailure(); }
                        })
                        .catch(() => { clearTimeout(id); handleFailure(); });

                        <div className="fixed inset-0 bg-black/95 backdrop-blur-2xl z-[9000] flex items-center justify-center">
                            <div className="flex flex-col items-center w-64">
                                <div className="w-full h-2 bg-slate-900 rounded-full overflow-hidden relative mb-6 border border-cyan-500/30 shadow-inner">
                                    <div className="absolute h-full bg-cyan-500 rounded-full animate-line-bar shadow-[0_0_12px_rgba(6,182,212,0.8)]" />
                                </div>
                                <p className="text-white font-black uppercase text-[10px] tracking-[0.5em] animate-pulse">TUNGGU SEBENTAR</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        } catch(err) {
            console.error("Mount error:", err);
        }
    </script>
</body>
</html>
